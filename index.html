<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#c9d9f5">
    <meta name="description" content="Mr. Baby Productions">
    <title>Mr. Baby Productions</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23c9d9f5'/%3E%3Cpath d='M12 46V18h8l12 15 12-15h8v28h-9V31L32 45 21 31v15z' fill='%23111111'/%3E%3C/svg%3E">
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        font-synthesis: none;
        --background: #c9d9f5;
        --foreground: #111111;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100svh;
        overflow: hidden;
        background: var(--background);
        color: var(--foreground);
      }

      button {
        font: inherit;
      }

      .screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        width: 100%;
        min-height: 100svh;
      }

      .intro {
        z-index: 2;
        border: 0;
        padding: 1.5rem;
        background: var(--background);
        color: var(--foreground);
        cursor: pointer;
      }

      .wordmark {
        display: block;
        font-size: clamp(2rem, 3.6vw, 4.25rem);
        font-weight: 900;
        line-height: 0.96;
        letter-spacing: -0.065em;
        text-align: center;
        text-transform: uppercase;
      }

      .wordmark span {
        display: block;
      }

      .contact {
        z-index: 1;
        background: #000000;
        color: #ffffff;
      }

      .email {
        border: 0;
        padding: 1rem;
        background: transparent;
        color: inherit;
        font-size: clamp(1rem, 1.25vw, 1.2rem);
        font-weight: 700;
        letter-spacing: -0.025em;
        cursor: copy;
      }

      .email:hover {
        text-decoration: underline;
        text-decoration-thickness: 0.09em;
        text-underline-offset: 0.18em;
      }

      .intro:focus-visible,
      .email:focus-visible {
        outline: 3px solid currentColor;
        outline-offset: -7px;
      }

      .intro[hidden] {
        display: none;
      }

      @media (max-width: 600px) {
        .wordmark {
          font-size: clamp(2rem, 11vw, 3.6rem);
        }

        .email {
          max-width: calc(100vw - 2rem);
          overflow-wrap: anywhere;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <button class="screen intro" type="button" aria-label="Show the Mr. Baby Productions email address">
        <span class="wordmark" aria-hidden="true">
          <span>Mr. Baby</span>
          <span>Productions</span>
        </span>
      </button>

      <section class="screen contact" aria-label="Contact Mr. Baby Productions">
        <button class="email" type="button" aria-describedby="copy-status">
          hi@mrbabyproductions.com
        </button>
        <span id="copy-status" role="status" aria-live="polite" hidden></span>
      </section>
    </main>

    <script>
      const EMAIL = "hi@mrbabyproductions.com";
      const themes = [
        { background: "#c9d9f5", foreground: "#111111" },
        { background: "#ff3fc8", foreground: "#850016" },
        { background: "#1f4a9b", foreground: "#d6e2f8" }
      ];

      const intro = document.querySelector(".intro");
      const emailButton = document.querySelector(".email");
      const status = document.querySelector("#copy-status");
      const themeColor = document.querySelector('meta[name="theme-color"]');

      const randomNumber = window.crypto?.getRandomValues
        ? window.crypto.getRandomValues(new Uint32Array(1))[0]
        : Math.floor(Math.random() * 4294967296);
      const theme = themes[randomNumber % themes.length];

      document.documentElement.style.setProperty("--background", theme.background);
      document.documentElement.style.setProperty("--foreground", theme.foreground);
      themeColor.setAttribute("content", theme.background);

      intro.addEventListener("click", () => {
        intro.hidden = true;
        emailButton.focus({ preventScroll: true });
      });

      async function copyEmail() {
        try {
          await navigator.clipboard.writeText(EMAIL);
        } catch {
          const textArea = document.createElement("textarea");
          textArea.value = EMAIL;
          textArea.setAttribute("readonly", "");
          textArea.style.position = "fixed";
          textArea.style.opacity = "0";
          document.body.appendChild(textArea);
          textArea.select();
          document.execCommand("copy");
          textArea.remove();
        }

        emailButton.textContent = "Copied!";
        status.hidden = false;
        status.textContent = `${EMAIL} copied to clipboard`;

        window.setTimeout(() => {
          emailButton.textContent = EMAIL;
          status.textContent = "";
          status.hidden = true;
        }, 1200);
      }

      emailButton.addEventListener("click", copyEmail);
    </script>
  </body>
</html>
